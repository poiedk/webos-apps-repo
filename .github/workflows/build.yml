name: Build webOS apps
on:
  push:
    branches: [main]
    paths: ['apps/**','scripts/**','.github/workflows/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        app: [wifi-watch, wled-fix]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --global @webos-tools/cli
      - name: Build
        run: |
          mkdir -p dist
          if [ "${{ matrix.app }}" = "wifi-watch" ]; then
            node --check apps/wifi-watch/service/service.js
            node --check apps/wifi-watch/app/js/app.js
            sh -n apps/wifi-watch/service/autostart.sh
            test -x apps/wifi-watch/service/autostart.sh
            ares-package --check apps/wifi-watch/app apps/wifi-watch/service
            ares-package --no-minify --outdir dist apps/wifi-watch/app apps/wifi-watch/service
          else
            ares-package --no-minify --outdir dist apps/wled-fix/app
          fi
          ls -lh dist/*.ipk
          if [ "${{ matrix.app }}" = "wifi-watch" ]; then
            IPK="$(find dist -maxdepth 1 -name '*.ipk' -print -quit)"
            echo "Verifying bundled WiFi Watch service and icons..."
            ar p "$IPK" data.tar.gz | tar -tzf - | grep -q 'usr/palm/services/org.webosbrew.wifiwatch.service/service.js' || {
              echo "::error::WiFi Watch service is missing from the IPK"
              exit 1
            }
            ar p "$IPK" data.tar.gz | tar -tzf - | grep -q 'usr/palm/applications/org.webosbrew.wifiwatch/icon.png' || {
              echo "::error::WiFi Watch PNG icon is missing from the IPK"
              exit 1
            }
            ar p "$IPK" data.tar.gz | tar -tvzf - | grep -q '^-..x.*usr/palm/services/org.webosbrew.wifiwatch.service/autostart.sh' || {
              echo "::error::WiFi Watch autostart hook is missing or not executable in the IPK"
              exit 1
            }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ipk
          path: dist/*.ipk
          if-no-files-found: error

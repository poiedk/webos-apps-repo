name: Build PS5 WebKit Host Android Prototype

on:
  push:
    branches:
      - chatgpt/ps5-webkit-host-android
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p ps5-webkit-host-android assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ps5-webkit-host-android-prototype
          path: ps5-webkit-host-android/app/build/outputs/apk/debug/app-debug.apk

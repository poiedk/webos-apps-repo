name: Release webOS app
on:
  push:
    tags: ['wifi-watch-v*','wled-fix-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --global @webos-tools/cli
      - name: Select app
        run: |
          case "$GITHUB_REF_NAME" in
            wifi-watch-v*) echo "APP=wifi-watch" >> "$GITHUB_ENV" ;;
            wled-fix-v*) echo "APP=wled-fix" >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
      - name: Build
        run: |
          mkdir -p dist
          if [ "$APP" = "wifi-watch" ]; then
            ares-package --no-minify --outdir dist apps/wifi-watch/app apps/wifi-watch/service
          else
            ares-package --no-minify --outdir dist apps/wled-fix/app
          fi
          echo "IPK=$(find dist -maxdepth 1 -name '*.ipk' -print -quit)" >> "$GITHUB_ENV"
      - name: Generate manifest
        run: node scripts/gen-manifest.js "apps/$APP" "$IPK" "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$IPK" dist/*.manifest.json --clobber

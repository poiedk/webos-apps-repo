name: Release webOS app

on:
  push:
    tags:
      - 'wifi-watch-v*'
      - 'wled-fix-v*'
    branches:
      - main
    paths:
      - '.release/wled-fix-*'
      - '.release/wifi-watch-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --global @webos-tools/cli

      - name: Select app and tag
        run: |
          if [[ "$GITHUB_REF_NAME" == wifi-watch-v* ]]; then
            APP="wifi-watch"
            TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" == wled-fix-v* ]]; then
            APP="wled-fix"
            TAG="$GITHUB_REF_NAME"
          elif [[ "$(git log -1 --pretty=%s)" == "release: trigger WiFi Watch "* ]]; then
            APP="wifi-watch"
            VERSION="$(node -p "require('./apps/wifi-watch/app/appinfo.json').version")"
            TAG="wifi-watch-v$VERSION"
          elif [[ "$(git log -1 --pretty=%s)" == "release: trigger WLED Fix "* ]]; then
            APP="wled-fix"
            VERSION="$(node -p "require('./apps/wled-fix/app/appinfo.json').version")"
            TAG="wled-fix-v$VERSION"
          else
            echo "No release target selected"
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build exact release package
        run: |
          mkdir -p dist
          if [ "$APP" = "wifi-watch" ]; then
            node --check apps/wifi-watch/service/service.js
            node --check apps/wifi-watch/app/js/app.js
            sh -n apps/wifi-watch/service/autostart.sh
            test -x apps/wifi-watch/service/autostart.sh
            ares-package --no-minify --outdir dist apps/wifi-watch/app apps/wifi-watch/service
          else
            ares-package --no-minify --outdir dist apps/wled-fix/app
          fi
          IPK="$(find dist -maxdepth 1 -name '*.ipk' -print -quit)"
          test -n "$IPK"
          echo "IPK=$IPK" >> "$GITHUB_ENV"
          sha256sum "$IPK"
          if [ "$APP" = "wifi-watch" ]; then
            APP_ID="org.webosbrew.wifiwatch"
          else
            APP_ID="org.webosbrew.wledfix"
          fi
          ar p "$IPK" data.tar.gz | tar -tzf - | grep -q "usr/palm/applications/$APP_ID/bold-icon.svg" || {
            echo "::error::Bold Badge icon is missing from the IPK"
            exit 1
          }
          if [ "$APP" = "wifi-watch" ]; then
            echo "Verifying bundled WiFi Watch service and icons..."
            ar p "$IPK" data.tar.gz | tar -tzf - | grep -q 'usr/palm/services/org.webosbrew.wifiwatch.service/service.js' || {
              echo "::error::WiFi Watch service is missing from the IPK"
              exit 1
            }
            ar p "$IPK" data.tar.gz | tar -tzf - | grep -q 'usr/palm/applications/org.webosbrew.wifiwatch/bold-icon.svg' || {
              echo "::error::WiFi Watch Bold Badge icon is missing from the IPK"
              exit 1
            }
            ar p "$IPK" data.tar.gz | tar -tvzf - | grep -q '^-..x.*usr/palm/services/org.webosbrew.wifiwatch.service/autostart.sh' || {
              echo "::error::WiFi Watch autostart hook is missing or not executable in the IPK"
              exit 1
            }
          fi

      - name: Publish package, manifest and catalog
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          root = Path(".")
          app = os.environ["APP"]
          ipk = Path(os.environ["IPK"])
          info = json.loads((root / "apps" / app / "app" / "appinfo.json").read_text())

          packages_dir = root / "packages"
          manifests_dir = root / "manifests"
          packages_dir.mkdir(exist_ok=True)
          manifests_dir.mkdir(exist_ok=True)

          dst = packages_dir / ipk.name
          shutil.copy2(ipk, dst)

          catalog_svg = root / "apps" / app / "app" / "catalog-icon.svg"
          catalog_png = root / "apps" / app / "app" / "catalog-icon.png"
          if catalog_png.exists():
              icon_rel = f"apps/{app}/app/catalog-icon.png"
          elif catalog_svg.exists():
              icon_rel = f"apps/{app}/app/catalog-icon.svg"
          else:
              icon_rel = f"apps/{app}/app/{info['icon']}"

          source_sha = os.environ["GITHUB_SHA"]
          icon_uri = f"https://raw.githubusercontent.com/poiedk/webos-apps-repo/{source_sha}/{icon_rel}"
          manifest = {
              "id": info["id"],
              "version": info["version"],
              "type": info.get("type", "web"),
              "title": info["title"],
              "appDescription": info.get("appDescription", info["title"]),
              "iconUri": icon_uri,
              "sourceUrl": f"https://github.com/poiedk/webos-apps-repo/tree/main/apps/{app}",
              "rootRequired": True,
              "ipkUrl": f"https://raw.githubusercontent.com/poiedk/webos-apps-repo/main/packages/{ipk.name}",
              "ipkHash": {"sha256": hashlib.sha256(dst.read_bytes()).hexdigest()},
              "ipkSize": dst.stat().st_size,
          }
          manifest_path = manifests_dir / f"{info['id']}.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          descriptions = {
              "org.webosbrew.wifiwatch": (
                  "Background Wi-Fi watchdog, diagnostics and safe recovery.",
                  "descriptions/wifi-watch.html",
              ),
              "org.webosbrew.wledfix": (
                  "WLED discovery, Hyperion target repair and recovery.",
                  "descriptions/wled-fix.html",
              ),
          }
          short_desc, desc_path = descriptions[info["id"]]
          entry = {
              "id": info["id"],
              "title": info["title"],
              "shortDescription": short_desc,
              "iconUri": icon_uri,
              "fullDescriptionUrl": f"https://raw.githubusercontent.com/poiedk/webos-apps-repo/main/{desc_path}",
              "manifest": manifest,
          }

          for name in ("repo.json", "repo-v3.json"):
              path = root / name
              data = json.loads(path.read_text())
              packages = [p for p in data.get("packages", []) if p.get("id") != info["id"]]
              packages.append(entry)
              packages.sort(key=lambda p: p.get("title", "").lower())
              data["packages"] = packages
              data["paging"] = {
                  "page": 1,
                  "count": len(packages),
                  "maxPage": 1,
                  "itemsTotal": len(packages),
              }
              path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Commit catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ manifests/ repo.json repo-v3.json
          if git diff --cached --quiet; then
            echo "Catalog already up to date"
            exit 0
          fi
          VERSION="$(node -p "require('./apps/' + process.env.APP + '/app/appinfo.json').version")"
          git commit -m "catalog: publish $APP $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main

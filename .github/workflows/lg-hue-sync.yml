name: LG Hue Sync CI

on:
  push:
    branches: [main]
    tags: ['lg-hue-sync-v*']
    paths:
      - 'apps/lg-hue-sync/**'
      - '.github/workflows/lg-hue-sync.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/lg-hue-sync/**'
      - '.github/workflows/lg-hue-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lg-hue-sync
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/lg-hue-sync -> target
      - run: python3 scripts/check_release.py
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo clippy --bin lg-hue-sync -- -D warnings
      - name: Validate embedded dashboard JavaScript
        run: perl -0777 -ne 'print $1 if /<script>(.*)<\/script>/s' src/web/ui.html | node --check -

  webos-target:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lg-hue-sync
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - name: Verify ARMv7 Linux artifact
        run: file target/armv7-unknown-linux-gnueabi/release/lg-hue-sync | grep -q 'ELF 32-bit.*ARM'
      - name: Stage release binary
        if: startsWith(github.ref, 'refs/tags/lg-hue-sync-v')
        run: |
          mkdir -p release
          cp target/armv7-unknown-linux-gnueabi/release/lg-hue-sync release/lg-hue-sync-armv7
          sha256sum release/lg-hue-sync-armv7 > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/lg-hue-sync-v')
        with:
          name: lg-hue-sync-webos-armv7-release
          path: apps/lg-hue-sync/release/

  webos3-target:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lg-hue-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global @webos-tools/cli
      - run: make build-webos3
      - name: Verify legacy ARMv7 Linux artifact
        run: file target/webos3-armv7/lg-hue-sync | grep -q 'ELF 32-bit.*ARM'
      - name: Report legacy GLIBC requirements
        run: readelf --version-info target/webos3-armv7/lg-hue-sync | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sort -Vu | uniq || true
      - name: Build Homebrew IPK with native daemon
        env:
          LG_HUE_SYNC_BINARY: target/webos3-armv7/lg-hue-sync
          LG_HUE_SYNC_OUTPUT_DIR: legacy-artifact
        run: |
          mkdir -p legacy-artifact
          python3 scripts/package_ipk.py
      - name: Stage legacy and Homebrew artifacts
        run: |
          cp target/webos3-armv7/lg-hue-sync legacy-artifact/lg-hue-sync-webos3-armv7
          sha256sum legacy-artifact/lg-hue-sync-webos3-armv7 > legacy-artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lg-hue-sync-webos3-${{ github.sha }}
          path: apps/lg-hue-sync/legacy-artifact/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/lg-hue-sync-v')
    needs: [test, webos-target, webos3-target]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lg-hue-sync-webos-armv7-release
          path: release
      - name: Publish verified daemon release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes


  catalog:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, webos-target, webos3-target]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lg-hue-sync-webos3-${{ github.sha }}
          path: lg-hue-sync-artifact
      - name: Verify Homebrew package contents
        run: |
          IPK="$(find lg-hue-sync-artifact -maxdepth 1 -name 'org.webosbrew.lg-hue-sync_*.ipk' -print -quit)"
          test -n "$IPK"
          ar p "$IPK" data.tar.gz | tar -tzf - | grep -q 'usr/palm/applications/org.webosbrew.lg-hue-sync/appinfo.json'
          ar p "$IPK" data.tar.gz | tar -tvzf - | grep -q '^-..x.*usr/palm/applications/org.webosbrew.lg-hue-sync/bin/lg-hue-sync'
          ar p "$IPK" data.tar.gz | tar -tvzf - | grep -q '^-..x.*usr/palm/applications/org.webosbrew.lg-hue-sync/startup.sh'
      - name: Publish package and update repository catalog
        run: |
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path

          root = Path(".")
          artifact = root / "lg-hue-sync-artifact"
          manifest_path = artifact / "org.webosbrew.lg-hue-sync.manifest.json"
          manifest = json.loads(manifest_path.read_text())

          ipks = list(artifact.glob("org.webosbrew.lg-hue-sync_*.ipk"))
          if len(ipks) != 1:
              raise SystemExit(f"expected one IPK, found {len(ipks)}")

          packages_dir = root / "packages"
          manifests_dir = root / "manifests"
          packages_dir.mkdir(exist_ok=True)
          manifests_dir.mkdir(exist_ok=True)

          shutil.copy2(ipks[0], packages_dir / ipks[0].name)
          shutil.copy2(manifest_path, manifests_dir / "org.webosbrew.lg-hue-sync.json")

          entry = {
              "id": manifest["id"],
              "title": manifest["title"],
              "shortDescription": "Native ambient sync for WLED, Philips Hue and Nanoleaf.",
              "iconUri": manifest["iconUri"],
              "fullDescriptionUrl": "https://raw.githubusercontent.com/poiedk/webos-apps-repo/main/descriptions/lg-hue-sync.html",
              "manifest": manifest,
          }

          for name in ("repo.json", "repo-v3.json"):
              path = root / name
              data = json.loads(path.read_text())
              packages = [p for p in data.get("packages", []) if p.get("id") != manifest["id"]]
              packages.append(entry)
              packages.sort(key=lambda p: p.get("title", "").lower())
              data["packages"] = packages
              data["paging"] = {
                  "page": 1,
                  "count": len(packages),
                  "maxPage": 1,
                  "itemsTotal": len(packages),
              }
              path.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Commit catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ manifests/ repo.json repo-v3.json
          if git diff --cached --quiet; then
            echo "Catalog already up to date"
            exit 0
          fi
          git commit -m "catalog: publish LG Hue Sync 0.4.5"
          git pull --rebase origin main
          git push origin HEAD:main

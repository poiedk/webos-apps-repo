<!doctype html>
<html><head><meta charset="utf-8"><title>Bluetooth Manager</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0c1828;color:#f5faff;font:24px Arial,sans-serif}
*{box-sizing:border-box}.wrap{padding:28px 40px}.top{font-size:42px;border-bottom:1px solid #40546d;padding-bottom:16px}
.warning{font-size:19px;color:#ffcf8c;margin:14px 0}.info{height:50px;color:#90c9dd}
.row{padding:14px 20px;margin:8px 0;background:#1c3045;border:2px solid #304d60}
.row.focus{border-color:#78dcfa;background:#264968}.minor{font-size:17px;color:#b5cfdd}
.footer{font-size:16px;color:#aac5ce;margin-top:10px}
</style></head>
<body><div class="wrap">
<div class="top">Bluetooth Manager <span style="font-size:20px">Preview 0.1.0</span></div>
<div class="warning">Legacy webOS compatibility preview. Magic Remote Bluetooth must not be disabled.</div>
<div id="info" class="info">Select Refresh to inspect trusted devices.</div>
<div id="rows"></div>
<div class="footer">UP / DOWN: navigate | OK: select | BACK: exit | Pairing/power toggle blocked pending TV compatibility</div>
</div>
<script>
(function(){
'use strict';
var devices=[],rows=[],focus=0,busy=false,selected=-1,found=[];
var addressRe=/^([0-9a-f]{2}:){5}[0-9a-f]{2}$/i;
function setInfo(t){document.getElementById('info').textContent=t;}
function exec(cmd,cb){
 var bridge=new PalmServiceBridge();
 bridge.onservicecallback=function(raw){
   try{var m=JSON.parse(raw);if(m.returnValue===false)throw Error(m.errorText||'exec failed');
     cb(null,m.stdoutString||'',m.stderrString||'');
   }catch(e){cb(e,'','');}
 };
 try{bridge.call('luna://org.webosbrew.hbchannel.service/exec',JSON.stringify({command:cmd}));}
 catch(e){cb(e,'','');}
}
function luna(endpoint,args,cb){
 if(busy)return;busy=true;setInfo('Communicating with Bluetooth service...');
 // Endpoint and all possible argument values come from a local allowlist.
 var cmd='luna-send -n 1 -f luna://com.webos.service.bluetooth/'+endpoint+' '+JSON.stringify(JSON.stringify(args));
 exec(cmd,function(err,out,stderr){busy=false;
   if(err){setInfo('Root service unavailable: '+err.message);return;}
   try{var response=JSON.parse(out.slice(out.indexOf('{')));
     if(response.returnValue===false){setInfo(response.errorText||'Unsupported Bluetooth operation');return;}
     cb(response);
   }catch(e){setInfo('No compatible response. Check firmware support. '+stderr.slice(0,120));}
 });
}
function render(){
 var host=document.getElementById('rows');rows=[
  {label:'Refresh trusted devices',kind:'refresh'},
  {label:'Scan nearby audio devices',kind:'scan'},
  {label:'Connect selected audio device',kind:'connect'},
  {label:'Disconnect selected audio device',kind:'disconnect'},
  {label:'Remove selected trusted audio device (press OK twice)',kind:'remove'},
  {label:'Refresh device status',kind:'refresh'}
 ];
 for(var i=0;i<devices.length;i++)rows.push({label:(i+1)+'. '+devices[i].name+' — '+devices[i].state,kind:'device',index:i});
 for(var f=0;f<found.length;f++)rows.push({label:'Nearby: '+found[f].name+' ('+found[f].address+')',kind:'nearby',index:f});
 rows.push({label:'Back / Exit',kind:'exit'});
 if(focus>=rows.length)focus=rows.length-1;
 var html='';for(var j=0;j<rows.length;j++)
   html+='<div class="row'+(focus===j?' focus':'')+'">'+escapeHTML(rows[j].label)+'</div>';
 host.innerHTML=html;
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x];});}
function refresh(){
 luna('gap/getTrustedDevices',{service:'all'},function(r){
   var list=r.device||[];devices=[];
   for(var i=0;i<list.length;i++){
     var d=list[i];if(d&&addressRe.test(d.address||''))devices.push({name:String(d.name||'Device'),address:d.address,state:String(d.state||'unknown'),service:'audio'});
   }
   setInfo(devices.length+' trusted device(s). Select one, then connect or disconnect.');
   render();
 });
}
var confirmRemove='';
function act(){
 var row=rows[focus];if(!row||busy)return;
 if(row.kind==='exit'){window.close();return;}
 if(row.kind==='device'){selected=row.index;confirmRemove='';setInfo('Selected '+devices[selected].name);return;}
 if(row.kind==='nearby'){setInfo('Discovered '+found[row.index].name+'. Pairing is handled by TV settings until firmware support is verified.');return;}
 if(row.kind==='scan'){
   luna('gap/findDevices',{deviceClass:4,seconds:6},function(r){
     var d=r.device;found=[];
     if(d&&addressRe.test(d.address||''))found.push({address:d.address,name:String(d.name||'Device')});
     setInfo(found.length?'Scan returned a device. Refresh/scan again for more.':'Scan started or completed without a device.');render();
   });return;
 }
 if(row.kind==='refresh'){refresh();return;}
 if(selected<0||!devices[selected]){setInfo('Select a trusted audio device first.');return;}
 var d=devices[selected];
 if(!addressRe.test(d.address)){setInfo('Invalid Bluetooth address');return;}
 if(row.kind==='remove'){
   if(confirmRemove!==d.address){confirmRemove=d.address;setInfo('Press OK again to permanently forget '+d.name);return;}
   confirmRemove='';
   luna('gap/removeTrustedDevice',{service:'audio',address:d.address},function(){selected=-1;setInfo('Remove requested; refresh to confirm.');refresh();});return;
 }
 luna('service/'+row.kind,{service:'audio',address:d.address},function(){
   setInfo(row.kind+' requested for '+d.name+' (asynchronous; refresh to check state).');
   setTimeout(refresh,1200);
 });
}
document.addEventListener('keydown',function(e){
 var c=e.keyCode;
 if(c===38){focus=(focus+rows.length-1)%rows.length;render();e.preventDefault();}
 if(c===40){focus=(focus+1)%rows.length;render();e.preventDefault();}
 if(c===13){act();e.preventDefault();}
 if(c===461||c===27){window.close();e.preventDefault();}
});
render();refresh();
})();
</script></body></html>
